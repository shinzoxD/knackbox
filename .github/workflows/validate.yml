name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Validate all skills
        run: python scripts/validate.py

  ecosystem-compatibility:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify Skills CLI discovery
        run: |
          expected="$(find skills -mindepth 3 -maxdepth 3 -name SKILL.md | wc -l | tr -d ' ')"
          output="$(NO_COLOR=1 npx --yes skills@1.5.16 add . --list)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Eq "Found[[:space:]]+${expected}[[:space:]]+skills"

  cli:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Test knackbox CLI
        run: |
          cd packages/cli
          node bin/knackbox.js help
          node bin/knackbox.js list --catalog ../../catalog.json --category coding >/dev/null
          npm test

  site:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check whether site changed
        id: site-changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -q '^site/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No site changes detected; skipping site build."
          fi
      - uses: actions/setup-node@v6
        if: steps.site-changes.outputs.changed == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build site
        if: steps.site-changes.outputs.changed == 'true'
        run: |
          cd site
          npm ci
          npm run build

  update-catalog:
    # Regenerates catalog.json and the README table after merges to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, ecosystem-compatibility, cli]
    runs-on: ubuntu-latest
    # Avoid parallel catalog commits racing with each other / rapid pushes
    concurrency:
      group: knackbox-update-catalog-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Rebuild catalog
        run: python scripts/build_catalog.py
      - name: Commit catalog if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json README.md
          if git diff --staged --quiet; then
            echo "Catalog already up to date."
            exit 0
          fi
          git commit -m "chore: regenerate catalog [skip ci]"
          # Rapid consecutive pushes used to fail with non-fast-forward.
          # Rebase onto origin/main and retry the push.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Catalog commit pushed."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/main..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push catalog after retries."
          exit 1
