name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Validate all skills
        run: python scripts/validate.py

  ecosystem-compatibility:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify Skills CLI discovery
        run: |
          expected="$(find skills -mindepth 3 -maxdepth 3 -name SKILL.md | wc -l | tr -d ' ')"
          output="$(NO_COLOR=1 npx --yes skills@1.5.16 add . --list)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Eq "Found .*[^0-9]${expected}[^0-9].* skills"

  site:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check whether site changed
        id: site-changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -q '^site/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No site changes detected; skipping site build."
          fi
      - uses: actions/setup-node@v6
        if: steps.site-changes.outputs.changed == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build site
        if: steps.site-changes.outputs.changed == 'true'
        run: |
          cd site
          npm ci
          npm run build

  update-catalog:
    # Regenerates catalog.json and the README table after merges to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Rebuild catalog
        run: python scripts/build_catalog.py
      - name: Commit catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json README.md
          git diff --staged --quiet || git commit -m "chore: regenerate catalog [skip ci]"
          git push
